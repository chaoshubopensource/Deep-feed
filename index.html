<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Feed - PC TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .video-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100vh; }
        .video-snap { scroll-snap-align: start; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Header Brand -->
    <header class="fixed top-0 left-0 w-full p-4 z-50 flex justify-center pointer-events-none">
        <h1 class="text-xl font-black tracking-tighter text-white/60 drop-shadow-lg">DEEP FEED</h1>
    </header>

    <!-- Global Volume Control -->
    <div class="fixed bottom-6 left-6 z-50 flex items-center gap-3 bg-black/40 backdrop-blur-md p-2 rounded-full border border-white/10">
        <span class="text-xs font-semibold px-2 text-white/60">VOL</span>
        <input type="range" id="globalVolume" min="0" max="1" step="0.1" value="0.5" class="w-24 h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white">
    </div>

    <!-- Main Feed -->
    <div id="feed" class="video-container hide-scrollbar">
        <!-- Videos will be injected here by JavaScript -->
    </div>

    <!-- Comments Panel (Hidden by default) -->
    <div id="commentsPanel" class="fixed right-0 top-0 h-full w-80 bg-[#121212] shadow-2xl z-[60] hidden flex flex-col animate-slide-in">
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-[#1a1a1a]">
            <h3 class="text-white font-bold">Comments</h3>
            <button onclick="toggleComments(false)" class="text-white/60 hover:text-white text-2xl">&times;</button>
        </div>
        <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar"></div>
        <div class="p-4 border-t border-white/10 flex gap-2 bg-[#1a1a1a]">
            <input type="text" placeholder="Add a comment..." class="flex-1 bg-white/10 rounded-full px-4 py-2 text-white text-sm focus:outline-none focus:ring-1 focus:ring-white/30">
            <button class="text-blue-400">Send</button>
        </div>
    </div>

    <script>
        const MOCK_VIDEOS = [
            {
                id: '1',
                url: 'https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-light-1285-large.mp4',
                username: 'neon_vibes',
                description: 'Exploring the neon nights of Tokyo! 🌃✨ #tokyo #neon #vibes',
                hashtags: ['tokyo', 'neon', 'vibes'],
                musicName: 'Synthwave Dreams - Night City',
                likes: 12400, favorites: 890, shares: 450,
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=neon',
                comments: [{id:'c1', user:'user1', text:'This is amazing!', time:'2h ago', likes:12}, {id:'c2', user:'user2', text:'Love the colors', time:'1h ago', likes:5}]
            },
            {
                id: '2',
                url: 'https://assets.mixkit.co/videos/preview/mixkit-woman-walking-on-the-beach-1220-large.mp4',
                username: 'ocean_soul',
                description: 'Peaceful morning at the shore. 🌊☀️ #beach #nature #peace',
                hashtags: ['beach', 'nature', 'peace'],
                musicName: 'Ocean Breezes - Lofi Girl',
                likes: 8500, favorites: 1200, shares: 310,
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=ocean',
                comments: [{id:'c3', user:'traveler', text:'Where is this?', time:'3h ago', likes:45}]
            },
            {
                id: '3',
                url: 'https://assets.mixkit.co/videos/preview/mixkit-man-dancing-under-the-rain-1354-large.mp4',
                username: 'rain_dance',
                description: 'Let the rain wash away all the pain... 🌧️💃 #rain #dance #emotion',
                hashtags: ['rain', 'dance', 'emotion'],
                musicName: 'Rhythm of Rain - Jazz Master',
                likes: 15600, favorites: 2100, shares: 890,
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=rain',
                comments: [{id:'c4', user:'dancer1', text:'Incredible moves!', time:'10m ago', likes:8}]
            }
        ];

        const feed = document.getElementById('feed');
        const commentsPanel = document.getElementById('commentsPanel');
        const commentsList = document.getElementById('commentsList');
        const volumeInput = document.getElementById('globalVolume');

        // Volume persistence
        volumeInput.value = localStorage.getItem('deepfeed-volume') || "0.5";

        function initFeed() {
            MOCK_VIDEOS.forEach((video, index) => {
                const section = document.createElement('div');
                section.className = 'video-snap';
                section.innerHTML = `
                    <video id="video-${video.id}" src="${video.url}" loop playsinline class="h-full aspect-[9/16] object-cover cursor-pointer" onclick="togglePlay(${index})"></video>

                    <div class="absolute bottom-4 left-4 text-white z-10 pointer-events-none">
                        <p class="font-bold text-lg">@${video.username}</p>
                        <p class="text-sm mb-2">${video.description}</p>
                        <div class="flex flex-wrap gap-2 text-sm font-semibold">${video.hashtags.map(t => `<span>#${t}</span>`).join('')}</div>
                        <div class="mt-2 flex items-center gap-2 text-sm italic">
                            <div class="w-3 h-3 bg-white/50 rounded-full animate-spin"></div>
                            <span>${video.musicName}</span>
                        </div>
                    </div>

                    <div class="absolute right-4 bottom-20 flex flex-col gap-6 items-center z-20">
                        <div class="flex flex-col items-center gap-1">
                            <button onclick="likeVideo(this)" class="p-3 rounded-full text-white hover:bg-white/10 transition-all active:scale-90">❤️</button>
                            <span class="text-white text-xs font-semibold">${video.likes}</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openComments(${index})">
                            <button class="p-3 rounded-full text-white hover:bg-white/10 transition-all active:scale-90">💬</button>
                            <span class="text-white text-xs font-semibold">${video.comments.length}</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <button class="p-3 rounded-full text-white hover:bg-white/10 transition-all active:scale-90">🔖</button>
                            <span class="text-white text-xs font-semibold">${video.favorites}</span>
                        </div>
                        <div class="mt-4 w-12 h-12 rounded-full border-2 border-white overflow-hidden animate-spin-slow">
                            <img src="${video.avatar}" class="w-full h-full object-cover">
                        </div>
                    </div>
                `;
                feed.appendChild(section);
            });

            setupIntersectionObserver();
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play().catch(() => {});
                        video.volume = volumeInput.value;
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-snap').forEach(div => observer.observe(div));
        }

        function togglePlay(index) {
            const videos = document.querySelectorAll('video');
            const v = videos[index];
            v.paused ? v.play() : v.pause();
        }

        function likeVideo(btn) {
            btn.classList.toggle('text-red-500');
            btn.classList.toggle('scale-110');
        }

        function openComments(index) {
            const video = MOCK_VIDEOS[index];
            commentsList.innerHTML = video.comments.map(c => `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-600 shrink-0 overflow-hidden">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${c.user}">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white font-semibold text-xs">${c.user}</span>
                        <p class="text-white/80 text-sm">${c.text}</p>
                        <div class="flex gap-3 mt-1 text-[10px] text-white/40">
                            <span>${c.time}</span>
                            <span>Like (${c.likes})</span>
                        </div>
                    </div>
                </div>
            `).join('');
            toggleComments(true);
        }

        function toggleComments(show) {
            commentsPanel.style.display = show ? 'flex' : 'none';
        }

        volumeInput.oninput = (e) => {
            const vol = e.target.value;
            localStorage.setItem('deepfeed-volume', vol);
            document.querySelectorAll('video').forEach(v => v.volume = vol);
        };

        // Keyboard shortcuts for iframes
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            if (key === 'S' || key === 'D') {
                feed.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
            } else if (key === 'W' || key === 'A') {
                feed.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
            }
        });

        initFeed();
    </script>
</body>
</html>
